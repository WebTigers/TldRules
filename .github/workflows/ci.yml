name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint PHP sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate catalog JSON
        run: php -r '$d=json_decode(file_get_contents("data/tld-rules.json"),true); if(json_last_error()!==JSON_ERROR_NONE){fwrite(STDERR,"invalid JSON\n");exit(1);} if(empty($d["tlds"])){fwrite(STDERR,"no tlds\n");exit(1);} echo count($d["tlds"])." TLDs\n";'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
